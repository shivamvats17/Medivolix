name: Medivolix Continuous Integration (CI)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # ==============================================================================
  # Job 1: Java Backend Build and Unit Tests
  # ==============================================================================
  backend-ci:
    name: Backend Build & Test (Java 21 / Maven)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Eclipse Temurin JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Run Backend Unit Tests
        working-directory: backend
        run: mvn clean test

      - name: Build Web Application Archive (WAR)
        working-directory: backend
        run: mvn package -DskipTests

      - name: Upload Backend WAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: medivolix-backend-war
          path: backend/target/medivolix.war
          if-no-files-found: error
          retention-days: 7

  # ==============================================================================
  # Job 2: React Frontend Dependency & Production Bundle Build
  # ==============================================================================
  frontend-ci:
    name: Frontend Build (Node.js 20 / Vite)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Run Frontend Unit & Component Tests (Vitest)
        working-directory: frontend
        run: npm test

      - name: Run Frontend Linter (Oxlint)
        working-directory: frontend
        run: npm run lint

      - name: Build Production Distribution
        working-directory: frontend
        run: npm run build

      - name: Upload Frontend Static Assets
        uses: actions/upload-artifact@v4
        with:
          name: medivolix-frontend-dist
          path: frontend/dist/
          if-no-files-found: error
          retention-days: 7

  # ==============================================================================
  # Job 3: Docker Composition Validation
  # ==============================================================================
  docker-validation:
    name: Docker Configuration Validation
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: |
          cp .env.example .env
          docker compose config --quiet
          echo "docker-compose.yml configuration is valid."
