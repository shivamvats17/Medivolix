# ==============================================================================
# Medivolix Backend Configuration (Default Local Settings)
# Override using environment variables or a local .env file.
# ==============================================================================

# Server Configuration
server.port=8080
server.contextPath=/

# Database Configuration (HikariCP / MySQL 8+)
db.url=jdbc:mysql://localhost:3306/medivolix_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
db.user=root
db.password=shiv@17sql
db.driver=com.mysql.cj.jdbc.Driver

# Connection Pool Settings
db.pool.maximumPoolSize=10
db.pool.minimumIdle=2
db.pool.idleTimeout=30000
db.pool.connectionTimeout=20000

# CORS Configuration (Permitted frontend origins separated by comma)
cors.allowedOrigins=http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000

# Business Domain Thresholds
app.stockFreshnessHours=24
app.lowStockThreshold=10
app.expiryWarningDays=45

# Session Configuration
app.sessionTimeoutMinutes=120
