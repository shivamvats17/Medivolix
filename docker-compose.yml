# ==============================================================================
# Medivolix Full-Stack Multi-Container Composition
# Services:
#   1. db: MySQL 8.0 relational database with auto-initialized schema and seed data
#   2. backend: Apache Tomcat 10.1 running Jakarta Servlets 6.0 REST API
#   3. frontend: Nginx reverse proxy serving optimized React 19 single-page app
# ==============================================================================

version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: medivolix-db
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${DB_NAME:-medivolix_db}
      MYSQL_USER: ${DB_USER:-medivolix_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-medivolix_pass}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./database/indexes.sql:/docker-entrypoint-initdb.d/02_indexes.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/03_seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - medivolix-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: medivolix-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://db:3306/${DB_NAME:-medivolix_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
      DB_USER: ${DB_USER:-medivolix_user}
      DB_PASSWORD: ${DB_PASSWORD:-medivolix_pass}
      CORS_ALLOWEDORIGINS: http://localhost,http://localhost:80,http://localhost:5173,http://127.0.0.1
    ports:
      - "8080:8080"
    networks:
      - medivolix-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: medivolix-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-80}:80"
    networks:
      - medivolix-network

volumes:
  db_data:
    driver: local

networks:
  medivolix-network:
    driver: bridge
