# ==============================================================================
# Medivolix Render Blueprint Specification (render.yaml)
# Documentation: https://render.com/docs/blueprint-spec
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # Backend API (Java 17+ / Tomcat 10.1 / Jakarta Servlets)
  # Matches keys and values from backend/.env
  # ----------------------------------------------------------------------------
  - type: web
    name: medivolix-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: oregon
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 8080

      - key: DB_URL
        value: jdbc:mysql://YOUR_MYSQL_HOST:3306/medivolix_db?useSSL=true&requireSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
        sync: false

      - key: DB_USER
        value: root
        sync: false

      - key: DB_PASSWORD
        sync: false

      - key: CORS_ALLOWED_ORIGINS
        value: https://medivolix-frontend.onrender.com,http://localhost:5173

      - key: STOCK_FRESHNESS_HOURS
        value: 24

      - key: LOW_STOCK_THRESHOLD
        value: 10

      - key: EXPIRY_WARNING_DAYS
        value: 45

  # ----------------------------------------------------------------------------
  # Frontend SPA (React 19 / Vite / React Router DOM v7)
  # Matches keys and values from frontend/.env
  # ----------------------------------------------------------------------------
  - type: static
    name: medivolix-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: medivolix-backend
          property: host
